# The staging "server": a one-node Kubernetes cluster in Docker.
# NodePort 30080 is also published on the host, so staging opens at http://localhost:30080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: asag
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: 127.0.0.1
