# Jenkins configuration as code (JCasC). Read on every start, so the controller can be
# rebuilt from this file at any time.
jenkins:
  systemMessage: >-
    asag-eval CI/CD: every commit on every branch is linted, tested, built into an image and
    smoke-tested; main is also deployed to the kind staging cluster.
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      # Read-only dashboard without login. The port is published on 127.0.0.1 only.
      allowAnonymousRead: true
  # To enable the "Push to Docker Hub" stage, add a 'dockerhub' username/token credential
  # and set the image name here, e.g.:
  # globalNodeProperties:
  #   - envVars:
  #       env:
  #         - key: DOCKERHUB_REPO
  #           value: docker.io/<user>/asag-eval

unclassified:
  location:
    url: http://localhost:8080/

credentials:
  system:
    domainCredentials:
      - credentials:
          - file:
              scope: GLOBAL
              id: kubeconfig-staging
              description: kind cluster 'asag' (address inside the Docker network)
              fileName: kubeconfig
              secretBytes: ${readFileBase64:/run/secrets/kubeconfig}

jobs:
  - script: >
      multibranchPipelineJob('asag-eval') {
        displayName('asag-eval')
        description('Jenkinsfile of github.com/9ani/asag-eval. Branches are discovered and polled every minute.')
        branchSources {
          branchSource {
            source {
              git {
                id('asag-eval')
                remote('https://github.com/9ani/asag-eval.git')
                traits {
                  gitBranchDiscovery()
                }
              }
            }
          }
        }
        triggers {
          // No public URL for a GitHub webhook on a laptop, so new commits are polled.
          periodicFolderTrigger {
            interval('1m')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
      }
