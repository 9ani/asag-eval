name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets the release workflow run this whole pipeline before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.16.*"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # The coverage threshold (90%) is set in pyproject.toml.
      - run: python -m pytest --cov --cov-report=term-missing

  build:
    name: Build package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  reproduce:
    name: Reproduce reference results
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # The wheel, not the source tree: this is what a user installs.
      - run: python -m pip install dist/*.whl
      - run: asag-eval evaluate examples/sample_predictions.jsonl --out examples/expected
      - run: >
          asag-eval compare examples/sample_predictions.jsonl examples/sample_baseline.jsonl
          --out examples/expected
      # Figures depend on the font renderer, so only the numbers must match exactly.
      - name: Fail if any reported number changed
        run: |
          # Marks new files as tracked-but-empty, so a result missing from the
          # committed set shows up in the diff as well.
          git add --intent-to-add examples/expected
          git diff --exit-code -- "examples/expected/*.json" "examples/expected/*.md"
      - uses: actions/upload-artifact@v7
        with:
          name: example-report
          path: examples/expected/
          if-no-files-found: error
