[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asag-eval"
version = "0.1.0"
description = "Reproducible evaluation of automated short-answer grading models: agreement metrics, question-cluster bootstrap, calibration and risk-coverage analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gani Uapov" }]
keywords = ["short answer grading", "evaluation", "quadratic weighted kappa", "bootstrap", "calibration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff==0.16.*",
  # Test oracle only: our metrics are checked against scikit-learn, but do not depend on it.
  "scikit-learn>=1.4",
]

[project.scripts]
asag-eval = "asag_eval.cli:main"

[project.urls]
Repository = "https://github.com/9ani/asag-eval"
Issues = "https://github.com/9ani/asag-eval/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
# A numerical warning is a wrong result waiting to happen: fail on it.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["asag_eval"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "RUF"]
