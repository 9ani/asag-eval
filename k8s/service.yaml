apiVersion: v1
kind: Service
metadata:
  name: asag-eval
  namespace: asag-staging
  labels:
    app.kubernetes.io/name: asag-eval
spec:
  # NodePort: reachable on the kind node, and from the host through ci/kind-cluster.yaml.
  type: NodePort
  selector:
    app.kubernetes.io/name: asag-eval
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
